# Docker Compose de production (VPS)
# L'API n'est pas exposée sur l'hôte : le front Next.js la proxifie en interne.
# Le front écoute sur 127.0.0.1:3010, derrière nginx (thor.antoinegourgue.dev).
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: thor-api:latest
    container_name: thor-api
    volumes:
      - ./data/train_station:/app/data/train_station:ro
      - ./configs:/app/configs:ro
      - ./models:/app/models:ro
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - thor-network

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: thor-web:latest
    container_name: thor-web
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      - NODE_ENV=production
      - PYTHON_BACKEND_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - thor-network

networks:
  thor-network:
    name: thor-network
    driver: bridge
